name: Release

# Tag a commit and this publishes the APK to a GitHub Release:
#   git tag v1.1 && git push origin v1.1
# Or run it by hand from the Actions tab, giving the tag to create.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the changelog can find the previous tag

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag must start with 'v' (got '$TAG')"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Signing is optional. With the four secrets set we ship a properly signed
      # release APK; without them a debug-signed one, and the notes say which.
      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret; falling back to a debug-signed APK."
          fi

      - name: Build APK
        env:
          APK_VERSION_NAME: ${{ steps.version.outputs.version }}
          # Monotonic across runs, which is what Android needs to allow an upgrade.
          APK_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          if [ "$SIGNED" = "true" ]; then
            gradle assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "out/BuzzX9EQ-$VERSION.apk"
          else
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "out/BuzzX9EQ-$VERSION-debug.apk"
          fi
          ls -l out

      - name: Compose release notes
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n1 || true)

          {
            echo "**Install:** download the \`.apk\` below, open it on the phone, and allow"
            echo "installs from whichever app you opened it with."
            echo ""
            if [ "$SIGNED" = "true" ]; then
              echo "Signed with the project release key, so it installs straight over an"
              echo "earlier release."
            else
              echo "> [!WARNING]"
              echo "> **Debug-signed build.** CI generates a throwaway debug key on every"
              echo "> run, so this will *not* install over an earlier version — uninstall"
              echo "> the old one first. Adding the signing secrets fixes this permanently;"
              echo "> see \"Signed releases\" in the README."
            fi
            echo ""
            echo "## Changes"
            echo ""
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..HEAD"
              echo ""
              echo "**Full diff:** ${PREV}...${TAG}"
            else
              git log --no-merges --pretty='- %s' -n 20
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" out/*.apk \
            --title "Buzz X9 EQ $VERSION" \
            --notes-file release-notes.md
